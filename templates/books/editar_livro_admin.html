{% extends "base.html" %}

{% block title %}
Editar {{ livro.titulo }} | Liberium
{% endblock %}

{% block content %}

<section class="pagina-editar-livro-admin">

    <div class="editar-livro-container">

        <div class="cabecalho-editar-livro">

            <span>
                Administração
            </span>

            <h1>
                Editar livro
            </h1>

            <p>
                Corrija ou atualize as informações
                disponíveis no catálogo.
            </p>

        </div>


        <form
            method="POST"
            action="{{ url_for(
                'books_bp.editar_livro_admin',
                livro_id=livro.id
            ) }}"
            class="form-editar-livro"
        >

            <label>
                Título *

                <input
                    type="text"
                    name="titulo"
                    value="{{ livro.titulo }}"
                    required
                >
            </label>


            <label>
                Autor(a) *

                <input
                    type="text"
                    name="autor"
                    value="{{ livro.autor or '' }}"
                    required
                >
            </label>


            <label>
                Gênero

                <input
                    type="text"
                    name="genero"
                    value="{{ livro.genero or '' }}"
                >
            </label>


            <label>
                Editora

                <input
                    type="text"
                    name="editora"
                    value="{{ livro.editora or '' }}"
                >
            </label>


            <label>
                Número de páginas

                <input
                    type="number"
                    name="paginas"
                    min="1"
                    value="{{ livro.paginas or '' }}"
                >
            </label>


            <label>
                Ano

                <input
                    type="text"
                    name="ano"
                    value="{{ livro.ano or '' }}"
                >
            </label>


            <label>
                Idioma

                <input
                    type="text"
                    name="idioma"
                    value="{{ livro.idioma or '' }}"
                >
            </label>


            <label>
                Sinopse

                <textarea
                    name="descricao"
                    rows="8"
                >{{ livro.descricao or '' }}</textarea>

            </label>


            <div class="acoes-editar-livro">

                <a
                    href="{{ url_for(
                        'books_bp.ver',
                        id=livro.id
                    ) }}"
                >
                    Cancelar
                </a>

                <button type="submit">
                    Salvar alterações
                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}
